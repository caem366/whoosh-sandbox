services:
  postgres:
    image: postgres:17-alpine
    container_name: whoosh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: whoosh
      POSTGRES_USER: whoosh
      POSTGRES_PASSWORD: whoosh
    ports:
      - "5432:5432"
    volumes:
      - whoosh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoosh -d whoosh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  whoosh_postgres_data:
